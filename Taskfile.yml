# https://taskfile.dev

version: '3'

vars:
  EXTENSION_NAME: rdf
  EXTENSION_DIR: '{{.ROOT_DIR}}'
  WASM_TARGET: wasm32-wasip1

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ============================================================================
  # Setup
  # ============================================================================

  setup:
    desc: Install all required dependencies
    cmds:
      - task: setup:rust
      - task: setup:wasm-target

  setup:rust:
    desc: Check Rust installation (must be via rustup, not homebrew)
    cmds:
      - |
        if ! command -v rustup &> /dev/null; then
          echo "ERROR: rustup not found. Install Rust via rustup (not homebrew):"
          echo "  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh"
          exit 1
        fi
        echo "✓ rustup found: $(rustup --version)"
        echo "✓ rustc version: $(rustc --version)"

  setup:wasm-target:
    desc: Install WASM target for Zed extensions
    cmds:
      - |
        echo "Installing {{.WASM_TARGET}} target..."
        rustup target add {{.WASM_TARGET}}
        echo "✓ WASM target installed"

  # ============================================================================
  # Build
  # ============================================================================

  build:
    desc: Build the extension (compile Rust to WASM)
    deps: [setup:wasm-target]
    cmds:
      - |
        echo "Building extension..."
        cargo build --release --target {{.WASM_TARGET}}
        echo "✓ Build complete"
        echo ""
        echo "Output: target/{{.WASM_TARGET}}/release/zed_rdf.wasm"

  build:debug:
    desc: Build the extension in debug mode
    deps: [setup:wasm-target]
    cmds:
      - cargo build --target {{.WASM_TARGET}}

  build:check:
    desc: Check if the code compiles without building
    cmds:
      - cargo check --target {{.WASM_TARGET}}

  build:clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  # ============================================================================
  # Development
  # ============================================================================

  dev:install:
    desc: Build and install extension in Zed for development
    deps: [build]
    cmds:
      - |
        echo "Extension built successfully!"
        echo ""
        echo "To install in Zed:"
        echo "  1. Open Zed"
        echo "  2. Run: Cmd+Shift+P -> 'zed: install dev extension'"
        echo "  3. Select this directory: {{.EXTENSION_DIR}}"
        echo ""
        open -a Zed "{{.EXTENSION_DIR}}"

  dev:logs:
    desc: Open Zed with verbose logging for debugging
    cmds:
      - zed --foreground

  dev:open-log:
    desc: Open Zed log file
    cmds:
      - |
        echo "In Zed: Cmd+Shift+P -> 'zed: open log'"
        open -a Zed

  dev:watch:
    desc: Watch for changes and rebuild
    cmds:
      - |
        echo "Watching for changes... (Ctrl+C to stop)"
        cargo watch -x "build --target {{.WASM_TARGET}}"

  # ============================================================================
  # Testing
  # ============================================================================

  test:sparql:
    desc: Create a sample SPARQL file and open in Zed
    cmds:
      - |
        cat > /tmp/test.rq << 'EOF'
        PREFIX foaf: <http://xmlns.com/foaf/0.1/>
        PREFIX dc: <http://purl.org/dc/elements/1.1/>

        SELECT ?name ?email
        WHERE {
          ?person a foaf:Person ;
                  foaf:name ?name ;
                  foaf:mbox ?email .
          FILTER (CONTAINS(?name, "John"))
        }
        ORDER BY ?name
        LIMIT 10
        EOF
        open -a Zed /tmp/test.rq

  test:turtle:
    desc: Create a sample Turtle file and open in Zed
    cmds:
      - |
        cat > /tmp/test.ttl << 'EOF'
        @prefix foaf: <http://xmlns.com/foaf/0.1/> .
        @prefix dc: <http://purl.org/dc/elements/1.1/> .
        @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

        <http://example.org/person/1>
            a foaf:Person ;
            foaf:name "John Doe"@en ;
            foaf:age 30 ;
            foaf:knows _:bnode1 ;
            dc:created "2024-01-15"^^xsd:date .

        _:bnode1 foaf:name "Jane Doe" .
        EOF
        open -a Zed /tmp/test.ttl

  test:trig:
    desc: Create a sample TriG file and open in Zed
    cmds:
      - |
        cat > /tmp/test.trig << 'EOF'
        @prefix foaf: <http://xmlns.com/foaf/0.1/> .
        @prefix ex: <http://example.org/> .

        ex:graph1 {
            ex:person1 a foaf:Person ;
                       foaf:name "Alice" .
        }

        ex:graph2 {
            ex:person2 a foaf:Person ;
                       foaf:name "Bob" ;
                       foaf:knows ex:person1 .
        }
        EOF
        open -a Zed /tmp/test.trig

  test:all:
    desc: Create and open all sample files
    deps: [test:sparql, test:turtle, test:trig]

  # ============================================================================
  # Publishing
  # ============================================================================

  publish:check:
    desc: Validate extension before publishing
    deps: [build]
    cmds:
      - |
        echo "Checking extension structure..."

        # Check required files
        for file in extension.toml LICENSE README.md Cargo.toml; do
          if [ ! -f "{{.EXTENSION_DIR}}/$file" ]; then
            echo "ERROR: Missing required file: $file"
            exit 1
          fi
        done

        # Check Rust source
        if [ ! -f "{{.EXTENSION_DIR}}/src/lib.rs" ]; then
          echo "ERROR: Missing src/lib.rs"
          exit 1
        fi

        # Check WASM output
        if [ ! -f "{{.EXTENSION_DIR}}/target/{{.WASM_TARGET}}/release/zed_rdf.wasm" ]; then
          echo "ERROR: WASM not built. Run 'task build' first."
          exit 1
        fi

        # Check language directories
        for lang in sparql turtle trig; do
          if [ ! -d "{{.EXTENSION_DIR}}/languages/$lang" ]; then
            echo "ERROR: Missing language directory: languages/$lang"
            exit 1
          fi
          if [ ! -f "{{.EXTENSION_DIR}}/languages/$lang/config.toml" ]; then
            echo "ERROR: Missing config.toml for $lang"
            exit 1
          fi
          if [ ! -f "{{.EXTENSION_DIR}}/languages/$lang/highlights.scm" ]; then
            echo "ERROR: Missing highlights.scm for $lang"
            exit 1
          fi
        done

        echo "✓ All required files present"
        echo "✓ WASM built successfully"

        # Show extension info
        echo ""
        echo "Extension info from extension.toml:"
        grep -E "^(id|name|version)" {{.EXTENSION_DIR}}/extension.toml

  publish:bump-patch:
    desc: Bump patch version (0.1.0 -> 0.1.1)
    cmds:
      - |
        current=$(grep '^version' extension.toml | sed 's/.*"\(.*\)"/\1/')
        IFS='.' read -r major minor patch <<< "$current"
        new="$major.$minor.$((patch + 1))"
        sed -i '' "s/version = \"$current\"/version = \"$new\"/" extension.toml
        sed -i '' "s/version = \"$current\"/version = \"$new\"/" Cargo.toml
        echo "Version bumped: $current -> $new"

  publish:bump-minor:
    desc: Bump minor version (0.1.0 -> 0.2.0)
    cmds:
      - |
        current=$(grep '^version' extension.toml | sed 's/.*"\(.*\)"/\1/')
        IFS='.' read -r major minor patch <<< "$current"
        new="$major.$((minor + 1)).0"
        sed -i '' "s/version = \"$current\"/version = \"$new\"/" extension.toml
        sed -i '' "s/version = \"$current\"/version = \"$new\"/" Cargo.toml
        echo "Version bumped: $current -> $new"

  publish:instructions:
    desc: Show publishing instructions
    cmds:
      - |
        echo "=========================================="
        echo "Publishing to Zed Extensions Registry"
        echo "=========================================="
        echo ""
        echo "1. Build and validate:"
        echo "   task build"
        echo "   task publish:check"
        echo ""
        echo "2. Push your extension to GitHub:"
        echo "   git add ."
        echo "   git commit -m 'Initial release'"
        echo "   git push origin main"
        echo ""
        echo "3. Fork the Zed extensions repository:"
        echo "   https://github.com/zed-industries/extensions"
        echo ""
        echo "4. Clone your fork:"
        echo "   git clone https://github.com/YOUR_USERNAME/extensions"
        echo "   cd extensions"
        echo ""
        echo "5. Add your extension as a submodule:"
        echo "   git submodule add https://github.com/rpietzsch/zed-rdf-lsp extensions/rdf"
        echo ""
        echo "6. Add entry to extensions.toml:"
        echo '   [rdf]'
        echo '   submodule = "extensions/rdf"'
        echo '   version = "0.1.0"'
        echo ""
        echo "7. Sort and format:"
        echo "   pnpm install"
        echo "   pnpm sort-extensions"
        echo ""
        echo "8. Commit and create PR:"
        echo "   git add ."
        echo "   git commit -m 'Add RDF extension'"
        echo "   git push origin main"
        echo "   # Open PR at https://github.com/zed-industries/extensions"
        echo ""

  # ============================================================================
  # Manual Installation (no Rust toolchain required)
  # ============================================================================

  install:prebuilt:
    desc: Install prebuilt extension (no Rust needed) - downloads from GitHub release
    cmds:
      - |
        set -e
        echo "Installing RDF extension for Zed..."

        # Detect OS and set extension directory
        case "$(uname -s)" in
          Darwin)
            EXT_DIR="$HOME/Library/Application Support/Zed/extensions/installed/rdf"
            ;;
          Linux)
            EXT_DIR="$HOME/.local/share/zed/extensions/installed/rdf"
            ;;
          MINGW*|MSYS*|CYGWIN*)
            EXT_DIR="$APPDATA/Zed/extensions/installed/rdf"
            ;;
          *)
            echo "ERROR: Unsupported operating system"
            exit 1
            ;;
        esac

        echo "Extension directory: $EXT_DIR"

        # Create directory
        mkdir -p "$EXT_DIR"

        # Check if prebuilt files exist in repo
        if [ ! -f "{{.EXTENSION_DIR}}/dist/extension.wasm" ]; then
          echo "ERROR: Prebuilt files not found in dist/"
          echo "Either:"
          echo "  1. Download a release from GitHub: https://github.com/rpietzsch/zed-rdf-lsp/releases"
          echo "  2. Build from source: task build && task release:bundle"
          exit 1
        fi

        # Copy files
        echo "Copying extension files..."
        cp "{{.EXTENSION_DIR}}/dist/extension.wasm" "$EXT_DIR/"
        cp "{{.EXTENSION_DIR}}/extension.toml" "$EXT_DIR/"
        cp -r "{{.EXTENSION_DIR}}/languages" "$EXT_DIR/"

        # Copy grammars if present
        if [ -d "{{.EXTENSION_DIR}}/dist/grammars" ]; then
          cp -r "{{.EXTENSION_DIR}}/dist/grammars" "$EXT_DIR/"
        fi

        echo ""
        echo "✓ Extension installed successfully!"
        echo ""
        echo "Restart Zed to activate the extension."
        echo "The extension will be available for .rq, .sparql, .ttl, and .trig files."

  install:local:
    desc: Install from local build (requires prior 'task build')
    cmds:
      - |
        set -e
        echo "Installing RDF extension from local build..."

        # Detect OS and set extension directory
        case "$(uname -s)" in
          Darwin)
            EXT_DIR="$HOME/Library/Application Support/Zed/extensions/installed/rdf"
            ;;
          Linux)
            EXT_DIR="$HOME/.local/share/zed/extensions/installed/rdf"
            ;;
          MINGW*|MSYS*|CYGWIN*)
            EXT_DIR="$APPDATA/Zed/extensions/installed/rdf"
            ;;
          *)
            echo "ERROR: Unsupported operating system"
            exit 1
            ;;
        esac

        # Check if built
        WASM_FILE="{{.EXTENSION_DIR}}/target/{{.WASM_TARGET}}/release/zed_rdf.wasm"
        if [ ! -f "$WASM_FILE" ]; then
          echo "ERROR: Extension not built. Run 'task build' first."
          exit 1
        fi

        echo "Extension directory: $EXT_DIR"
        mkdir -p "$EXT_DIR"
        mkdir -p "$EXT_DIR/grammars"

        # Copy files
        echo "Copying extension files..."
        cp "$WASM_FILE" "$EXT_DIR/extension.wasm"
        cp "{{.EXTENSION_DIR}}/extension.toml" "$EXT_DIR/"
        cp -r "{{.EXTENSION_DIR}}/languages" "$EXT_DIR/"

        # Copy grammars if they exist (from previous dev install)
        if [ -f "{{.EXTENSION_DIR}}/grammars/sparql.wasm" ]; then
          cp "{{.EXTENSION_DIR}}/grammars/"*.wasm "$EXT_DIR/grammars/"
        fi

        echo ""
        echo "✓ Extension installed from local build!"
        echo ""
        echo "Restart Zed to activate the extension."

  install:uninstall:
    desc: Uninstall the extension
    cmds:
      - |
        echo "Uninstalling RDF extension..."

        case "$(uname -s)" in
          Darwin)
            EXT_DIR="$HOME/Library/Application Support/Zed/extensions/installed/rdf"
            ;;
          Linux)
            EXT_DIR="$HOME/.local/share/zed/extensions/installed/rdf"
            ;;
          MINGW*|MSYS*|CYGWIN*)
            EXT_DIR="$APPDATA/Zed/extensions/installed/rdf"
            ;;
        esac

        if [ -d "$EXT_DIR" ]; then
          rm -rf "$EXT_DIR"
          echo "✓ Extension uninstalled from: $EXT_DIR"
        else
          echo "Extension not found at: $EXT_DIR"
        fi

  install:windows:
    desc: Install on Windows (runs PowerShell script)
    cmds:
      - |
        echo "Running PowerShell install script..."
        echo ""
        echo "If this fails, run directly in PowerShell:"
        echo "  .\\scripts\\install.ps1"
        echo ""
        powershell -ExecutionPolicy Bypass -File scripts/install.ps1

  install:windows-uninstall:
    desc: Uninstall on Windows (runs PowerShell script)
    cmds:
      - powershell -ExecutionPolicy Bypass -File scripts/install.ps1 -Uninstall

  release:bundle:
    desc: Create a release bundle with precompiled artifacts
    deps: [build]
    cmds:
      - |
        set -e
        echo "Creating release bundle..."

        # Create dist directory
        mkdir -p "{{.EXTENSION_DIR}}/dist"
        mkdir -p "{{.EXTENSION_DIR}}/dist/grammars"
        mkdir -p "{{.EXTENSION_DIR}}/dist/languages"

        # Copy extension WASM
        cp "{{.EXTENSION_DIR}}/target/{{.WASM_TARGET}}/release/zed_rdf.wasm" \
           "{{.EXTENSION_DIR}}/dist/extension.wasm"

        # Copy grammar WASMs if they exist
        if [ -f "{{.EXTENSION_DIR}}/grammars/sparql.wasm" ]; then
          cp "{{.EXTENSION_DIR}}/grammars/"*.wasm "{{.EXTENSION_DIR}}/dist/grammars/"
        else
          echo "Note: Grammar WASMs not found. Users will need Zed to compile them."
          echo "      (Run 'zed: install dev extension' once to generate them)"
        fi

        # Copy language configs
        cp -r "{{.EXTENSION_DIR}}/languages/"* "{{.EXTENSION_DIR}}/dist/languages/"

        # Copy metadata
        cp "{{.EXTENSION_DIR}}/extension.toml" "{{.EXTENSION_DIR}}/dist/"
        cp "{{.EXTENSION_DIR}}/LICENSE" "{{.EXTENSION_DIR}}/dist/"
        cp "{{.EXTENSION_DIR}}/README.md" "{{.EXTENSION_DIR}}/dist/"

        # Create archive
        VERSION=$(grep '^version' extension.toml | sed 's/.*"\(.*\)"/\1/')
        ARCHIVE="rdf-extension-v${VERSION}.tar.gz"

        cd "{{.EXTENSION_DIR}}/dist"
        tar -czvf "../$ARCHIVE" .
        cd "{{.EXTENSION_DIR}}"

        echo ""
        echo "✓ Release bundle created: $ARCHIVE"
        echo ""
        echo "Contents:"
        tar -tzvf "$ARCHIVE"
        echo ""
        echo "Upload this to GitHub Releases for users without Rust toolchain."

  # ============================================================================
  # Utility
  # ============================================================================

  clean:
    desc: Clean all build artifacts and temporary files
    cmds:
      - cargo clean
      - rm -rf dist/
      - rm -f /tmp/test.rq /tmp/test.ttl /tmp/test.trig
      - rm -f rdf-extension-*.tar.gz

  info:
    desc: Show extension information
    cmds:
      - |
        echo "Extension: {{.EXTENSION_NAME}}"
        echo "Directory: {{.EXTENSION_DIR}}"
        echo "WASM Target: {{.WASM_TARGET}}"
        echo ""
        echo "=== extension.toml ==="
        cat {{.EXTENSION_DIR}}/extension.toml
        echo ""
        echo "=== Cargo.toml ==="
        cat {{.EXTENSION_DIR}}/Cargo.toml
